<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini POS Kantin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mini POS Kantin</h1>
        <p>Kasir sederhana untuk kantin kampus</p>
    </header>

    <main class="container">
        <section class="kartu">
            <h2>Input Barang</h2>
            <form id="form-barang" novalidate>
                <div class="grup-input">
                    <label for="nama-barang">Nama Barang</label>
                    <input type="text" id="nama-barang" placeholder="Contoh: Air Mineral">
                    <small class="pesan-error" id="error-nama"></small>
                </div>

                <div class="baris-input">
                    <div class="grup-input">
                        <label for="harga-barang">Harga Satuan (Rp)</label>
                        <input type="number" id="harga-barang" placeholder="Contoh: 3000">
                        <small class="pesan-error" id="error-harga"></small>
                    </div>

                    <div class="grup-input">
                        <label for="qty-barang">Qty</label>
                        <input type="number" id="qty-barang" placeholder="1" min="1">
                        <small class="pesan-error" id="error-qty"></small>
                    </div>
                </div>

                <button type="submit" class="tombol tombol-utama">Tambah ke Keranjang</button>
            </form>
        </section>

        <section class="kartu">
            <h2>Keranjang Belanja</h2>
            <div class="wadah-tabel">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Barang</th>
                            <th>Harga Satuan</th>
                            <th>Qty</th>
                            <th>Subtotal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="isi-keranjang"></tbody>
                </table>
            </div>
        </section>

        <section class="kartu">
            <h2>Pembayaran</h2>

            <div class="grup-input">
                <label for="kode-promo">Kode Promo (opsional)</label>
                <input type="text" id="kode-promo" placeholder="Masukkan kode promo">
                <small id="info-promo"></small>
            </div>

            <table class="ringkasan">
                <tr>
                    <td>Total Belanja</td>
                    <td id="total-belanja">Rp 0</td>
                </tr>
                <tr>
                    <td>Diskon <span id="keterangan-diskon"></span></td>
                    <td id="nominal-diskon">Rp 0</td>
                </tr>
                <tr class="total-akhir">
                    <td>Total Bayar</td>
                    <td id="total-akhir">Rp 0</td>
                </tr>
            </table>

            <div class="grup-input">
                <label for="uang-bayar">Uang Bayar (Rp)</label>
                <input type="number" id="uang-bayar" placeholder="Masukkan uang yang diterima">
            </div>

            <p id="kembalian" class="kembalian">Kembalian: Rp 0</p>

            <button type="button" id="tombol-reset" class="tombol tombol-bahaya">Transaksi Baru</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
